# Prepared only. Importing this Blueprint creates billable resources. Generation boots disabled and requires a
# separate, reviewed dashboard activation; the presence of FAL_KEY never enables it.
previews:
  generation: "off"

projects:
  - name: beatiq-musicme-production
    environments:
      - name: production
        networking:
          isolation: enabled
        permissions:
          protection: enabled
        services:
          - type: web
            name: beatiq-musicme-audio-production
            runtime: python
            rootDir: services/musicme-audio
            region: frankfurt
            plan: 0.5c-512mb
            numInstances: 1
            autoDeployTrigger: "off"
            buildCommand: "python3 -m pip install --require-hashes --only-binary=:all: -r requirements.lock"
            startCommand: python3 -m audioservice.server
            healthCheckPath: /readyz
            envVars:
              - key: PYTHON_VERSION
                value: 3.12.12
              - key: MUSICME_AUDIO_ENVIRONMENT
                value: production
              - key: MUSICME_AUDIO_ENGINE
                value: fal
              - key: MUSICME_AUDIO_GENERATION_MODE
                value: disabled
              - key: MUSICME_AUDIO_ENABLE_PRODUCTION_GENERATION
                value: "false"
              - key: MUSICME_AUDIO_COMMERCIAL_RIGHTS_APPROVED
                value: "false"
              - key: MUSICME_AUDIO_SECURITY_ACCEPTED
                value: "false"
              - key: MUSICME_AUDIO_PUBLIC_ACTIVATION_APPROVED
                value: "false"
              - key: MUSICME_AUDIO_INTERNAL_TEST_USER_IDS
                sync: false
              - key: MUSICME_AUDIO_PUBLIC_ELIGIBLE_USER_IDS
                sync: false
              - key: MUSICME_AUDIO_HOST
                value: 0.0.0.0
              - key: MUSICME_AUDIO_PORT
                value: "10000"
              - key: MUSICME_AUDIO_PUBLIC_BASE_URL
                sync: false
              - key: MUSICME_AUDIO_DATABASE_URL
                fromDatabase:
                  name: beatiq-musicme-audio-production-db
                  property: connectionString
              - key: MUSICME_AUDIO_JWT_ALGORITHMS
                value: RS256
              - key: MUSICME_AUDIO_JWKS_URL
                sync: false
              - key: MUSICME_AUDIO_JWT_ISSUER
                sync: false
              - key: MUSICME_AUDIO_JWT_AUDIENCE
                sync: false
              - key: MUSICME_AUDIO_SIGNING_SECRET
                generateValue: true
              - key: FAL_KEY
                sync: false
              - key: MUSICME_AUDIO_FAL_QUEUE_BASE_URL
                value: https://queue.fal.run
              - key: MUSICME_AUDIO_FAL_CUSTOM_LYRICS_ENDPOINT
                value: fal-ai/ace-step
              - key: MUSICME_AUDIO_FAL_PROMPT_ENDPOINT
                value: fal-ai/ace-step/prompt-to-audio
              - key: MUSICME_AUDIO_FAL_PRICE_PER_SECOND_USD
                value: "0.0002"
              - key: MUSICME_AUDIO_FAL_DAILY_BUDGET_USD
                value: "2.0"
              - key: MUSICME_AUDIO_STORAGE_BACKEND
                value: s3
              - key: MUSICME_AUDIO_STORAGE_ROOT
                value: /tmp/musicme-audio-scratch
              - key: MUSICME_AUDIO_OBJECT_ENDPOINT
                sync: false
              - key: MUSICME_AUDIO_OBJECT_BUCKET
                sync: false
              - key: MUSICME_AUDIO_OBJECT_REGION
                value: auto
              - key: MUSICME_AUDIO_OBJECT_ACCESS_KEY_ID
                sync: false
              - key: MUSICME_AUDIO_OBJECT_SECRET_ACCESS_KEY
                sync: false
              - key: MUSICME_AUDIO_OBJECT_PREFIX
                value: production
              - key: MUSICME_AUDIO_OBJECT_FORCE_PATH_STYLE
                value: "true"
              - key: MUSICME_AUDIO_WORKERS
                value: "1"
              - key: MUSICME_AUDIO_MAX_ATTEMPTS
                value: "1"
              - key: MUSICME_AUDIO_MAX_TAKES
                value: "1"
              - key: MUSICME_AUDIO_MIN_DURATION_SECONDS
                value: "5"
              - key: MUSICME_AUDIO_MAX_DURATION_SECONDS
                value: "240"
              - key: MUSICME_AUDIO_RENDER_TIMEOUT_SECONDS
                value: "600"
              - key: MUSICME_AUDIO_MAX_JOBS_PER_WINDOW
                value: "3"
              - key: MUSICME_AUDIO_RATE_WINDOW_SECONDS
                value: "86400"
              - key: MUSICME_AUDIO_MAX_ACTIVE_JOBS_PER_ACCOUNT
                value: "1"
              - key: MUSICME_AUDIO_MAX_QUEUED_JOBS
                value: "20"
              - key: MUSICME_AUDIO_ACCOUNT_STORAGE_QUOTA_BYTES
                value: "536870912"

        databases:
          - name: beatiq-musicme-audio-production-db
            region: frankfurt
            plan: 0.1c-256mb
            diskSizeGB: 1
            storageAutoscalingEnabled: false
            databaseName: musicme_audio_production
            user: musicme_audio_production
            ipAllowList: []
